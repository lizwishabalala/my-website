<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lizwi Search Site</title>
<style>
body{font-family:sans-serif;max-width:600px;margin:auto;padding:20px;background:#f5f5f5}
input{width:100%;padding:14px;font-size:18px;border-radius:10px;border:1px solid #ccc}
.card{background:white;padding:15px;margin:10px 0;border-radius:10px}
</style>
</head>
<body>
<h1>🔍 My Searchable Site</h1>
<input type="text" id="search" placeholder="Type to search..." onkeyup="search()">
<div id="list">
<div class="card">Welcome to my website - Durban</div>
<div class="card">Solar Products Available</div>
<div class="card">Contact Me on WhatsApp</div>
</div>
<script>
function search(){
let q=document.getElementById('search').value.toLowerCase();
let cards=document.getElementsByClassName('card');
for(let c of cards){c.style.display=c.innerText.toLowerCase().includes(q)?'block':'none';}
}
</script>
</body>
</html>
